<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 8º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho do Boletim -->
    <header class="cabecalho">
        <h1>Boletim Digital</h1>
        <h2>8º Ano</h2>
        <p class="estudante">Estudante: <strong>Estudante Exemplo</strong></p>
    </header>

    <main class="conteudo-principal">
        <!-- Área Superior com Cards de Resumo -->
        <section class="cards-container">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media" class="card-valor">—</p>
            </div>

            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-faltas" class="card-valor">—</p>
            </div>

            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="card-valor">—</p>
            </div>

            <div class="card">
                <h3>Precisam de Atenção</h3>
                <p id="card-atencao" class="card-valor">—</p>
            </div>

            <div class="card">
                <h3>Frequência Geral</h3>
                <p id="card-frequencia" class="card-valor">—</p>
                <span id="card-frequencia-texto" class="card-subtexto"></span>
            </div>
        </section>

        <!-- Sessões por Matéria (Estilo App Escola Paraná) -->
        <section id="materias-container" class="materias-container">
            <!-- Cada matéria vai aparecer em um card/sessão individual gerado pelo JavaScript -->
        </section>
    </main>

    <!-- Conexão com o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
